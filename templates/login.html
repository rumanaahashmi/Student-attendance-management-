{% extends "base.html" %}

{% block title %}Teacher Login - Attendance System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2>Teacher Login</h2>
            <p>Access management controls and mark attendance</p>
        </div>

        <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}">
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" placeholder="admin@school.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-key"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fa-solid fa-right-to-bracket"></i> Log In
                </button>
            </div>
        </form>

        <div class="demo-credentials-box">
            <i class="fa-solid fa-lightbulb"></i>
            <div>
                <strong>Demo Credentials:</strong>
                <p>Email: <code>admin@school.com</code> | Password: <code>admin123</code></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
