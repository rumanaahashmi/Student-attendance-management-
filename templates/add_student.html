{% extends "base.html" %}

{% block title %}Add New Student - Attendance System{% endblock %}

{% block content %}
<div class="form-page-container">
    <div class="card form-card">
        <div class="card-header">
            <h2><i class="fa-solid fa-user-plus"></i> Add New Student</h2>
            <a href="{{ url_for('view_students') }}" class="btn-link"><i class="fa-solid fa-arrow-left"></i> Back to Student List</a>
        </div>

        <form method="POST" action="{{ url_for('add_student') }}">
            <div class="form-group">
                <label for="roll"><i class="fa-solid fa-id-card"></i> Roll Number / Student ID</label>
                <input type="text" id="roll" name="roll" placeholder="e.g. 104" required>
            </div>

            <div class="form-group">
                <label for="name"><i class="fa-solid fa-user"></i> Full Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. Rahul Sharma" required>
            </div>

            <div class="form-group">
                <label for="course"><i class="fa-solid fa-book-open"></i> Course / Class</label>
                <input type="text" id="course" name="course" placeholder="e.g. Computer Science" required>
            </div>

            <div class="button-row form-actions">
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Add Student</button>
                <a href="{{ url_for('view_students') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
