{% extends "base.html" %}

{% block title %}Edit Student - Attendance System{% endblock %}

{% block content %}
<div class="form-page-container">
    <div class="card form-card">
        <div class="card-header">
            <h2><i class="fa-solid fa-user-pen"></i> Edit Student Details</h2>
            <a href="{{ url_for('view_students') }}" class="btn-link"><i class="fa-solid fa-arrow-left"></i> Back to Student List</a>
        </div>

        <form method="POST" action="{{ url_for('edit_student', student_id=student.id) }}">
            <div class="form-group">
                <label for="roll"><i class="fa-solid fa-id-card"></i> Roll Number / Student ID</label>
                <input type="text" id="roll" name="roll" value="{{ student.roll }}" required>
            </div>

            <div class="form-group">
                <label for="name"><i class="fa-solid fa-user"></i> Full Name</label>
                <input type="text" id="name" name="name" value="{{ student.name }}" required>
            </div>

            <div class="form-group">
                <label for="course"><i class="fa-solid fa-book-open"></i> Course / Class</label>
                <input type="text" id="course" name="course" value="{{ student.course }}" required>
            </div>

            <div class="button-row form-actions">
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Update Student</button>
                <a href="{{ url_for('view_students') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
